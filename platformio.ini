; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32s3

; Git cannot clone hooks; the first build points core.hooksPath at .githooks.
[env]
extra_scripts = pre:scripts/install_git_hooks.py

[env:seeed_xiao_esp32s3]
platform = espressif32@8.0.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags = 
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
; GxEPD2 drives the SSD1681 e-paper panel; it pulls in Adafruit GFX.
lib_deps = zinggjm/GxEPD2@1.6.9
; Host tests only; do not try to flash them to the board.
test_ignore = *

; Serial monitor on the native USB CDC port
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Upload over USB
upload_speed = 460800

; One-shot flasher that blanks the panel to white (shipping / returning it).
; Inherits its libraries from the board env, so the driver cannot drift.
[env:clean]
extends = env:seeed_xiao_esp32s3
build_src_filter = -<*> +<../tools/clean_display/main.cpp>

; Host-only parser tests: pio test -e native
[env:native]
platform = native
test_framework = unity
